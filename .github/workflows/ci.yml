name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all --release

  # The correctness claim, exercised as the CLI rather than as unit tests:
  # repack a synthetic checkpoint, prove the weights survived, then prove that
  # verification actually rejects a corrupted file.
  #
  # Note --min-speedup 1.0. CI runners have throttled storage whose bandwidth
  # surface is nearly flat, so `plan` correctly concludes that repacking buys
  # nothing and writes no plan. That is the tool working, not failing. These jobs
  # test the pipeline's correctness, so they lower the threshold to force a plan
  # regardless of what the runner's disk happens to be worth.
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: repack and verify
        run: |
          set -euo pipefail
          BIN=./target/release/potatomaxx
          cd "$(mktemp -d)"
          "$OLDPWD/$BIN" synth --experts 64 --layers 3 --tokens 4000 --top-k 6
          "$OLDPWD/$BIN" probe --corpus-mib 256 --out surf.json
          "$OLDPWD/$BIN" inspect synth.gguf
          "$OLDPWD/$BIN" analyse --model synth.gguf --trace synth.pmxtrace --probe surf.json
          "$OLDPWD/$BIN" plan --model synth.gguf --trace synth.pmxtrace --probe surf.json --min-speedup 1.0 --out p.pmxplan
          "$OLDPWD/$BIN" pack --model synth.gguf --plan p.pmxplan --out out.gguf
          "$OLDPWD/$BIN" verify --model synth.gguf --repacked out.gguf --plan p.pmxplan
          # A permutation moves bytes; it must not add or lose any.
          a=$(stat -c%s synth.gguf); b=$(stat -c%s out.gguf)
          test "$a" = "$b" || { echo "FAIL: size changed $a -> $b"; exit 1; }
          echo "OK: $a bytes in, $a bytes out"
      - name: verification must reject a tampered file
        run: |
          set -euo pipefail
          BIN=./target/release/potatomaxx
          cd "$(mktemp -d)"
          "$OLDPWD/$BIN" synth --experts 32 --layers 2 --tokens 3000 --top-k 4
          "$OLDPWD/$BIN" probe --corpus-mib 256 --out surf.json
          "$OLDPWD/$BIN" plan --model synth.gguf --trace synth.pmxtrace --probe surf.json --min-speedup 1.0 --out p.pmxplan
          "$OLDPWD/$BIN" pack --model synth.gguf --plan p.pmxplan --out out.gguf
          python3 -c "import os; n=os.path.getsize('out.gguf'); f=open('out.gguf','r+b'); f.seek(n//2); f.write(b'\xde\xad\xbe\xef'); f.close()"
          if "$OLDPWD/$BIN" verify --model synth.gguf --repacked out.gguf --plan p.pmxplan; then
            echo "FAIL: verification passed on a tampered file"
            exit 1
          fi
          echo "OK: tampering was detected"
